name: Verificar Produtos

on:
  schedule:
    - cron: '0 9 * * *'

  workflow_dispatch:

jobs:

  verificar:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Dependencias
      run: pip install -r requirements.txt

    - name: Executar
      run: python verificador.py

    - name: Commit
      run: |
        git config --global user.name github-actions
        git config --global user.email github-actions@github.com

        git add relatorio_integridade.md

        git commit -m "Relatorio diario" || exit 0

        git push
