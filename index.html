<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lar Prático | Ofertas Selecionadas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f3f4f6;
    font-family:Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

header{
    background:#F4E7DA;
    padding:35px 20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    position: relative;
    z-index: 10;
}

.logo{
    width:220px;
    max-width:90%;
    height:auto;
    display:block;
    margin:0 auto 15px;
}

.titulo-site{
    font-size:34px;
    font-weight:700;
    color:#a35732;
    letter-spacing:1px;
}

.subtitulo{
    color:#6b5b4f;
    margin-top:10px;
    font-size:16px;
}

/* Layout Principal com Sidebar */
.layout-principal {
    display: flex;
    flex: 1;
    max-width: 1300px;
    width: 100%;
    margin: 0 auto;
    padding: 25px;
    gap: 30px;
}

/* Menu Lateral (Sidebar) */
.sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    height: fit-content;
    position: sticky;
    top: 20px;
}

.sidebar h3 {
    color: #a35732;
    font-size: 18px;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #f3f4f6;
}

.filtros{
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.filtro{
    border: none;
    background: transparent;
    color: #6b5b4f;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    text-align: left;
    transition: .2s;
    font-size: 14px;
}

.filtro:hover{
    background: #F4E7DA;
    color: #a35732;
}

.filtro.ativo{
    background: #a35732;
    color: #fff;
}

/* Conteúdo Principal */
.conteudo-principal {
    flex: 1;
}

.contador{
    text-align: left;
    color:#666;
    margin-bottom:20px;
    font-size:14px;
    font-weight:600;
}

.busca-container{
    margin-bottom: 20px;
}

#pesquisa{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:16px;
    outline:none;
    background: #fff;
}

#pesquisa:focus{
    border-color:#a35732;
}

.banner{
    background:white;
    padding:30px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    margin-bottom: 30px;
}

.banner h2{
    color:#a35732;
    margin-bottom:12px;
}

.banner p{
    color:#666;
    line-height:1.5;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:24px;
}

.card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    transition:.2s ease;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:250px;
    object-fit:contain;
    background:white;
    padding:15px;
}

.info{
    padding:18px;
}

.info h3{
    font-size:16px;
    line-height:1.4;
    min-height:70px;
    color:#333;
}

.preco{
    font-size:28px;
    color:#00a650;
    font-weight:bold;
    margin-top:12px;
}

.parcela{
    font-size:13px;
    color:#777;
    margin-top:4px;
}

.selo{
    background:#00a650;
    color:white;
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.botao{
    display:block;
    text-align:center;
    background:#a35732;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:10px;
    margin-top:16px;
    font-weight:bold;
    transition:0.2s;
}

.botao:hover{
    background:#8b4728;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
    font-size:14px;
}

/* Responsividade para telas menores (celulares) */
@media (max-width: 768px) {
    .layout-principal {
        flex-direction: column;
        padding: 15px;
    }
    .sidebar {
        width: 100%;
        position: relative;
        top: 0;
    }
}
</style>
</head>

<body>

<header>
    <img src="Logo.png" alt="Lar Prático" class="logo">
    <div class="titulo-site">
        Lar Prático
    </div>
    <p class="subtitulo">
        Produtos selecionados para facilitar seu dia a dia
    </p>
</header>

<div class="layout-principal">
    <!-- Menu Lateral Esquerdo -->
    <aside class="sidebar">
        <h3>Categorias</h3>
        <div class="filtros">
            <button class="filtro ativo" data-categoria="todos">Todos</button>
            <button class="filtro" data-categoria="automotivo">Automotivo</button>
            <button class="filtro" data-categoria="beleza">Beleza</button>
            <button class="filtro" data-categoria="casa">Casa</button>
            <button class="filtro" data-categoria="cozinha">Cozinha</button>
            <button class="filtro" data-categoria="decoracao">Decoração</button>
            <button class="filtro" data-categoria="eletrodomesticos">Eletrodomésticos</button>
            <button class="filtro" data-categoria="ferramentas">Ferramentas</button>
            <button class="filtro" data-categoria="fitness">Fitness</button>
            <button class="filtro" data-categoria="iluminacao">Iluminação</button>
            <button class="filtro" data-categoria="lazer">Lazer</button>
            <button class="filtro" data-categoria="livros">Livros</button>
            <button class="filtro" data-categoria="moda">Moda</button>
            <button class="filtro" data-categoria="moveis">Móveis</button>
            <button class="filtro" data-categoria="pets">Pets</button>
            <button class="filtro" data-categoria="saude">Saúde</button>
            <button class="filtro" data-categoria="tecnologia">Tecnologia</button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="conteudo-principal">
        <section class="banner">
            <h2>🏠 Soluções práticas para sua casa</h2>
            <p>
                Ferramentas, utilidades domésticas e produtos selecionados com excelente custo-benefício.
            </p>
        </section>

        <div class="busca-container">
            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Pesquise um produto..."
                onkeyup="aplicarFiltros()"
            >
        </div>

        <div id="contador" class="contador"></div>

        <div id="produtos" class="produtos"></div>
    </main>
</div>

<footer>
    Alguns links podem gerar comissão de afiliado sem custo adicional para você. 
</footer>

<script>
let categoriaSelecionada = "todos";

function aplicarFiltros() {
    const filtro = document
        .getElementById("pesquisa")
        .value
        .toLowerCase();

    let visiveis = 0;

    document.querySelectorAll(".produto")
        .forEach(produto => {
            const texto = produto.innerText.toLowerCase();
            const atendePesquisa = texto.includes(filtro);
            const atendeCategoria =
                categoriaSelecionada === "todos" ||
                produto.dataset.categoria === categoriaSelecionada;

            if(atendePesquisa && atendeCategoria){
                produto.style.display = "";
                visiveis++;
            }else{
                produto.style.display = "none";
            }
        });

    const contador = document.getElementById("contador");
    if(contador){
        contador.innerText = `${visiveis} produto(s) encontrado(s)`;
    }
}

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_87wFOqu4gttxm7EfHlcwCrmWYss5QJ-9FxHbyIg-vBOM4QAKHJ1YYZ2EB3GA9AZbDiZokCO86OcP/pub?output=csv";

fetch(CSV_URL)
.then(resp => resp.text())
.then(data => {
    const linhas = data.trim().split("\n").slice(1);

    linhas.forEach(linha => {
        const colunas = linha.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
        if(!colunas || colunas.length < 5) return;

        const nome = colunas[0].replaceAll('"','').trim();
        const imagem = colunas[1].replaceAll('"','').trim();
        const preco = colunas[2].replaceAll('"','').trim();
        const link = colunas[3].replaceAll('"','').trim();
        const categoria = colunas[4].replaceAll('"','').trim().toLowerCase();

        document.getElementById("produtos").innerHTML += `
            <div class="card produto" data-categoria="${categoria}">
                <img src="${imagem}" alt="${nome}">
                <div class="info">
                    <div class="selo">
                        Oferta Especial
                    </div>
                    <h3>${nome}</h3>
                    <div class="preco">
                        ${preco}
                    </div>
                    <div class="parcela">
                        Confira disponibilidade e condições atualizadas
                    </div>
                    <a href="${link}" target="_blank" class="botao">
                        🛒 Ver Oferta
                    </a>
                </div>
            </div>
        `;
    });

    aplicarFiltros();
})
.catch(error => {
    document.getElementById("produtos").innerHTML = `
        <p style="text-align:center;color:red;">
            Não foi possível carregar os produtos.
        </p>
    `;
    console.error(error);
});

document.addEventListener("click", function(e){
    if(!e.target.classList.contains("filtro")) return;

    document.querySelectorAll(".filtro")
        .forEach(btn => btn.classList.remove("ativo"));

    e.target.classList.add("ativo");

    categoriaSelecionada = e.target.dataset.categoria;

    aplicarFiltros();
});
</script>

</body>
</html>
