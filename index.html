<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lar Prático | Ofertas Selecionadas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f3f4f6;
    font-family:Arial, Helvetica, sans-serif;
}

header{
    background:#f5e6d3;
    padding:30px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.logo{
    width:140px;
    height:auto;
    display:block;
    margin:0 auto 15px;
}

.titulo-site{
    font-size:32px;
    font-weight:bold;
    color:#8d4e2d;
}

.subtitulo{
    color:#6b5b4f;
    margin-top:8px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:24px;
}

.card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    transition:.2s ease;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:contain;
    background:white;
    padding:15px;
}

.info{
    padding:18px;
}

.info h3{
    font-size:16px;
    line-height:1.4;
    min-height:70px;
    color:#333;
}

.preco{
    font-size:28px;
    color:#00a650;
    font-weight:bold;
    margin-top:12px;
}

.parcela{
    font-size:13px;
    color:#777;
    margin-top:4px;
}

.botao{
    display:block;
    text-align:center;
    background:#3483fa;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:10px;
    margin-top:16px;
    font-weight:bold;
}

.botao:hover{
    background:#2968c8;
}

.selo{
    background:#00a650;
    color:white;
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

footer{
    text-align:center;
    padding:30px;
    color:#777;
    font-size:14px;
}

</style>
</head>

<body>

<header>

    <img src="logo.png" alt="Lar Prático" class="logo">

    <div class="titulo-site">
        Lar Prático
    </div>

    <p class="subtitulo">
        Produtos selecionados para facilitar seu dia a dia
    </p>

</header>

<div class="container">
    <div id="produtos" class="produtos"></div>
</div>

<footer>
    Alguns links podem gerar comissão de afiliado sem custo adicional para você.
</footer>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_87wFOqu4gttxm7EfHlcwCrmWYss5QJ-9FxHbyIg-vBOM4QAKHJ1YYZ2EB3GA9AZbDiZokCO86OcP/pub?output=csv";

fetch(CSV_URL)
.then(resp => resp.text())
.then(data => {

    const linhas = data.trim().split("\n").slice(1);

    linhas.forEach(linha => {

        const colunas = linha.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

        if(!colunas || colunas.length < 4) return;

        const nome = colunas[0].replaceAll('"','').trim();
        const imagem = colunas[1].replaceAll('"','').trim();
        const preco = colunas[2].replaceAll('"','').trim();
        const link = colunas[3].replaceAll('"','').trim();

        document.getElementById("produtos").innerHTML += `
        <div class="card">

            <img src="${imagem}" alt="${nome}">

            <div class="info">

                <div class="selo">
                    Oferta Especial
                </div>

                <h3>${nome}</h3>

                <div class="preco">
                    ${preco}
                </div>

                <div class="parcela">
                    Confira disponibilidade e condições atualizadas
                </div>

                <a href="${link}" target="_blank" class="botao">
                    🛒 Ver Oferta
                </a>

            </div>

        </div>
        `;

    });

})
.catch(error => {

    document.getElementById("produtos").innerHTML = `
        <p style="text-align:center;color:red;">
            Não foi possível carregar os produtos.
        </p>
    `;

    console.error(error);

});

</script>

</body>
</html>
