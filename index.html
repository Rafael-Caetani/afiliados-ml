<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ofertas Mercado Livre</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f5;
}

header{
    background:#ffe600;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

header h1{
    color:#333;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:contain;
    background:#fff;
    padding:10px;
}

.info{
    padding:15px;
}

.info h3{
    font-size:16px;
    line-height:1.4;
    min-height:70px;
}

.botao{
    display:block;
    text-align:center;
    background:#3483fa;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
    font-weight:bold;
}

.botao:hover{
    background:#2968c8;
}
</style>
</head>
<body>

<header>
    <h1>🔥 Ofertas Selecionadas</h1>
</header>

<div class="container">
    <div id="produtos" class="produtos"></div>
</div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_87wFOqu4gttxm7EfHlcwCrmWYss5QJ-9FxHbyIg-vBOM4QAKHJ1YYZ2EB3GA9AZbDiZokCO86OcP/pub?output=csv";

fetch(CSV_URL)
.then(response => response.text())
.then(data => {

    const linhas = data.trim().split("\n").slice(1);

    linhas.forEach(linha => {

        const colunas = linha.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

        if(!colunas || colunas.length < 3) return;

        const nome = colunas[0].replace(/"/g, '').trim();
        const imagem = colunas[1].replace(/"/g, '').trim();
        const link = colunas[2].replace(/"/g, '').trim();

        document.getElementById("produtos").innerHTML += `
            <div class="card">
                <img src="${imagem}" alt="${nome}">
                <div class="info">
                    <h3>${nome}</h3>
                    <a href="${link}" target="_blank" class="botao">
                        Ver Oferta
                    </a>
                </div>
            </div>
        `;
    });

})
.catch(error => {
    document.getElementById("produtos").innerHTML =
    "<p>Erro ao carregar produtos.</p>";
    console.error(error);
});

</script>

</body>
</html>
